<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="#f8fafc"/>

  <!-- Title -->
  <text x="30" y="42" font-size="26" font-weight="700" fill="#0f172a">Privacy-First Local RAG: Architecture</text>
  <text x="30" y="68" font-size="14" fill="#475569">Research assistant over NICE healthcare guidelines  |  Ollama + Chroma + BM25 + reranker + Streamlit  |  no internet at runtime</text>

  <!-- Air-gap boundary -->
  <rect x="16" y="90" width="1568" height="800" rx="14" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="36" y="115" font-size="13" font-weight="700" fill="#dc2626">NO INTERNET AT RUNTIME: models load from local folders, every service listens on 127.0.0.1 only</text>
  <text x="1564" y="115" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">Docker: app and Ollama sit on a network with no route out</text>

  <!-- ================= INGESTION PANEL ================= -->
  <rect x="46" y="130" width="330" height="740" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="66" y="158" font-size="14" font-weight="700" fill="#1d4ed8">INGESTION</text>
  <text x="66" y="176" font-size="11.5" fill="#475569">Upload in the app, or run: python ingest.py</text>

  <g stroke="#475569" stroke-width="1.5" fill="#ffffff">
    <rect x="66" y="194" width="290" height="72" rx="8"/>
    <rect x="66" y="284" width="290" height="72" rx="8"/>
    <rect x="66" y="374" width="290" height="72" rx="8"/>
    <rect x="66" y="464" width="290" height="72" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="211" y="217" font-size="14.5" font-weight="700">PDF documents</text>
    <text x="211" y="236" font-size="11.5" fill="#475569">8 NICE guidelines (public)</text>
    <text x="211" y="253" font-size="11.5" fill="#475569">stay on this machine</text>

    <text x="211" y="307" font-size="14.5" font-weight="700">PDF reader (PyMuPDF)</text>
    <text x="211" y="326" font-size="11.5" fill="#475569">Page by page, page footer removed</text>
    <text x="211" y="343" font-size="11.5" fill="#475569">Keeps file name, page, title</text>

    <text x="211" y="397" font-size="14.5" font-weight="700">Chunker</text>
    <text x="211" y="416" font-size="11.5" fill="#475569">Per page, up to ~500 tokens (2000 chars)</text>
    <text x="211" y="433" font-size="11.5" fill="#475569">200-character overlap</text>

    <text x="211" y="487" font-size="14.5" font-weight="700">Embedder</text>
    <text x="211" y="506" font-size="11.5" fill="#475569">nomic-embed-text via Ollama</text>
    <text x="211" y="523" font-size="11.5" fill="#475569">One 768-number vector per chunk</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="211" y1="266" x2="211" y2="282"/>
    <line x1="211" y1="356" x2="211" y2="372"/>
    <line x1="211" y1="446" x2="211" y2="462"/>
  </g>

  <!-- ================= MIDDLE COLUMN ================= -->
  <!-- BM25 index -->
  <rect x="412" y="322" width="230" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="527" y="345" font-size="14" font-weight="700" fill="#0f172a">BM25 keyword index</text>
    <text x="527" y="364" font-size="11.5" fill="#475569">built in memory from Chroma</text>
  </g>

  <!-- Chroma cylinder -->
  <path d="M412 410 V478 A115 14 0 0 0 642 478 V410" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <ellipse cx="527" cy="410" rx="115" ry="14" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
  <g text-anchor="middle" fill="#422006">
    <text x="527" y="436" font-size="15" font-weight="700">Chroma</text>
    <text x="527" y="453" font-size="11.5">vectors + text + metadata</text>
    <text x="527" y="469" font-size="11.5">data/chroma on local disk</text>
  </g>
  <line x1="527" y1="396" x2="527" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Reranker model -->
  <rect x="412" y="500" width="230" height="64" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 4"/>
  <g text-anchor="middle">
    <text x="527" y="524" font-size="14" font-weight="700" fill="#6d28d9">Reranker model</text>
    <text x="527" y="543" font-size="11.5" fill="#475569">bge-reranker-base, runs locally</text>
  </g>

  <!-- Ollama runtime -->
  <rect x="412" y="600" width="230" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <g text-anchor="middle" fill="#78350f">
    <text x="527" y="630" font-size="14.5" font-weight="700">Ollama runtime</text>
    <text x="527" y="654" font-size="11.5">listens on 127.0.0.1:11434</text>
    <text x="527" y="674" font-size="11.5">llama3.1:8b (4-bit)</text>
    <text x="527" y="692" font-size="11.5">nomic-embed-text</text>
    <text x="527" y="720" font-size="11" font-style="italic">on-device, no cloud</text>
  </g>

  <!-- ingestion -> Chroma / Ollama -->
  <line x1="356" y1="450" x2="410" y2="450" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="383" y="441" font-size="11" fill="#334155" text-anchor="middle">store</text>
  <path d="M211 536 V640 H410" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowOrange)"/>

  <!-- ================= QUESTION PANEL ================= -->
  <rect x="690" y="130" width="490" height="740" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="710" y="158" font-size="14" font-weight="700" fill="#15803d">QUESTION ANSWERING</text>

  <g stroke="#475569" stroke-width="1.5" fill="#ffffff">
    <rect x="715" y="175" width="440" height="50" rx="8"/>
    <rect x="715" y="243" width="440" height="50" rx="8"/>
    <rect x="715" y="311" width="440" height="140" rx="8"/>
    <rect x="715" y="469" width="440" height="56" rx="8" stroke="#7c3aed" stroke-dasharray="7 4" fill="#faf5ff"/>
    <rect x="715" y="543" width="440" height="70" rx="8"/>
    <rect x="715" y="631" width="440" height="56" rx="8"/>
    <rect x="715" y="705" width="440" height="78" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <rect x="715" y="801" width="440" height="56" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="935" y="196" font-size="14.5" font-weight="700">User question</text>
    <text x="935" y="214" font-size="11.5" fill="#475569">Streamlit page on 127.0.0.1:8501</text>

    <text x="935" y="264" font-size="14.5" font-weight="700">Embed the question</text>
    <text x="935" y="282" font-size="11.5" fill="#475569">Same nomic-embed-text model as ingestion</text>

    <text x="935" y="338" font-size="14.5" font-weight="700">Hybrid retrieval</text>
    <text x="935" y="364" font-size="11.5" fill="#475569">Meaning search: closest 20 chunks in Chroma</text>
    <text x="935" y="384" font-size="11.5" fill="#475569">Keyword search: best 20 chunks by BM25</text>
    <text x="935" y="410" font-size="11.5" fill="#475569">Merged into one list with Reciprocal Rank Fusion</text>
    <text x="935" y="434" font-size="10.5" fill="#64748b">chunks carry file + page + title</text>

    <text x="935" y="492" font-size="14.5" font-weight="700" fill="#6d28d9">Reranker</text>
    <text x="935" y="511" font-size="11.5" fill="#475569">Reads question + chunk together, keeps the best 5</text>

    <text x="935" y="565" font-size="14.5" font-weight="700">Prompt builder</text>
    <text x="935" y="584" font-size="11.5" fill="#475569">Sources numbered 1 to 5. Answer ONLY from them,</text>
    <text x="935" y="601" font-size="11.5" fill="#475569">end every claim with (Source n), else refuse</text>

    <text x="935" y="652" font-size="14.5" font-weight="700">Local LLM (Ollama)</text>
    <text x="935" y="671" font-size="11.5" fill="#475569">Llama 3.1 8B, 4-bit, temperature 0, 8192-token window</text>

    <text x="935" y="727" font-size="14.5" font-weight="700">Citation check: answer or refusal, nothing between</text>
    <text x="935" y="747" font-size="11.5" fill="#475569">Every cited Source n must exist; it becomes file, page, title</text>
    <text x="935" y="765" font-size="11.5" fill="#b91c1c">Otherwise: "I can't find this in the documents."</text>

    <text x="935" y="822" font-size="14.5" font-weight="700">Answer + sources</text>
    <text x="935" y="841" font-size="11.5" fill="#475569">Source chunks are shown only when there is an answer</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="935" y1="225" x2="935" y2="241"/>
    <line x1="935" y1="293" x2="935" y2="309"/>
    <line x1="935" y1="451" x2="935" y2="467"/>
    <line x1="935" y1="525" x2="935" y2="541"/>
    <line x1="935" y1="613" x2="935" y2="629"/>
    <line x1="935" y1="687" x2="935" y2="703"/>
    <line x1="935" y1="783" x2="935" y2="799"/>
  </g>

  <!-- BM25 <-> Retriever -->
  <line x1="644" y1="350" x2="713" y2="350" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- Chroma <-> Retriever -->
  <line x1="644" y1="435" x2="713" y2="435" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- Reranker model -> Reranker (purple) -->
  <line x1="642" y1="510" x2="713" y2="510" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>

  <!-- Ollama -> Embed question + Local LLM (orange) -->
  <path d="M642 640 H666 V268 H713" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowOrange)"/>
  <path d="M666 659 H713" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowOrange)"/>

  <!-- Audit logging (gray dotted): Answer -> Audit log -->
  <path d="M1155 829 H1200 V215 H1218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#arrowGray)"/>

  <!-- ================= SIDE PANELS ================= -->
  <!-- Audit log -->
  <rect x="1220" y="130" width="336" height="200" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1240" y="158" font-size="14" font-weight="700" fill="#c2410c">AUDIT LOG</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="1240" y="190">&#8226; One line per question: time, question,</text>
    <text x="1252" y="208">sources used, answered or refused</text>
    <text x="1240" y="234">&#8226; Only the start and end of the answer</text>
    <text x="1252" y="252">are kept, never the full text</text>
    <text x="1240" y="278">&#8226; Entries older than 24 hours are deleted</text>
    <text x="1240" y="304">&#8226; Stored in logs/audit.jsonl</text>
  </g>

  <!-- Evaluation -->
  <rect x="1220" y="350" width="336" height="270" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1240" y="378" font-size="14" font-weight="700" fill="#6d28d9">EVALUATION</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="1240" y="410">&#8226; 50 questions: 40 with an answer,</text>
    <text x="1252" y="428">10 with none in the documents</text>
    <text x="1240" y="454">&#8226; Retrieval: is the right file and page</text>
    <text x="1252" y="472">in the top 5? (dense, hybrid, reranked)</text>
    <text x="1240" y="498">&#8226; Does it refuse when there is no answer?</text>
    <text x="1240" y="524">&#8226; Q4 vs Q8 vs FP16: accuracy, speed, memory</text>
    <text x="1240" y="550">&#8226; Time per stage: embed, search, rerank,</text>
    <text x="1252" y="568">generate</text>
    <text x="1240" y="594">&#8226; Results page inside the app</text>
  </g>

  <!-- Offline hardening -->
  <rect x="1220" y="640" width="336" height="230" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1240" y="668" font-size="14" font-weight="700" fill="#334155">OFFLINE HARDENING</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="1240" y="698">&#8226; HF_HUB_OFFLINE=1: no model lookups</text>
    <text x="1240" y="722">&#8226; Streamlit usage statistics switched off</text>
    <text x="1240" y="746">&#8226; Streamlit and Ollama bind to 127.0.0.1</text>
    <text x="1240" y="770">&#8226; Docker network with no route out</text>
    <text x="1240" y="794">&#8226; A tiny gateway container forwards</text>
    <text x="1252" y="812">localhost:8501 to the app (no data)</text>
    <text x="1240" y="838">&#8226; Models mounted read-only from the host</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="12" fill="#334155">
    <rect x="30" y="911" width="26" height="14" rx="3" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="64" y="923">Pipeline step</text>

    <line x1="210" y1="918" x2="242" y2="918" stroke="#d97706" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="252" y="923">Ollama call (local)</text>

    <line x1="420" y1="918" x2="452" y2="918" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="462" y="923">Reranker call (local)</text>

    <line x1="640" y1="918" x2="672" y2="918" stroke="#64748b" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="682" y="923">Audit logging</text>

    <rect x="820" y="911" width="26" height="14" rx="3" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="854" y="923">No-internet boundary</text>
  </g>
</svg>
